<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151925" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1320" media="(prefers-color-scheme: dark)" />
    <script>
      // Follow the OS theme (tokens switch on data-theme="dark"); runs before first paint, so no flash.
      (function () {
        var q = matchMedia('(prefers-color-scheme: dark)'), r = document.documentElement
        function set() { r.dataset.theme = q.matches ? 'dark' : 'light' }
        set(); q.addEventListener('change', set)
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Kartoshka · Link check</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

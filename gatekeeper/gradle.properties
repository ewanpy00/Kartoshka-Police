org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Where the app finds core and the resident screens. The default, 10.0.2.2, is the Mac as seen from the
# Android emulator, so Run in Android Studio works as is. `make apk` passes its own host: 127.0.0.1 for a
# phone on USB (with adb reverse) or the laptop's Wi-Fi address.
coreUrl=http://10.0.2.2:8000
residentUrl=http://10.0.2.2:5174
# Private DNS hostname of a DNS Shield resolver with DoT, if one is deployed (empty: the setup button explains).
dnsHost=

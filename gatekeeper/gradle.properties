org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Where the app finds core and the resident screens. With `adb reverse tcp:8000 tcp:8000` and
# `adb reverse tcp:5174 tcp:5174` the phone reaches the Mac on 127.0.0.1; the emulator uses 10.0.2.2.
# Override per build: ./gradlew installDebug -PcoreUrl=http://192.168.1.20:8000
coreUrl=http://127.0.0.1:8000
residentUrl=http://127.0.0.1:5174
# Private DNS hostname of a DNS Shield resolver with DoT, if one is deployed (empty: the setup button explains).
dnsHost=

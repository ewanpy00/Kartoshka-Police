# Global brands that phishing kits imitate, used by the scorer only (brand-in-domain, look-alike tests).
# They are not on the scam radar and have no service catalog; safe_action falls back to the homepage.
#
# official_domains lists the sites people sign in to, not CDN hosts: those are allowlisted through
# Tranco, and a CDN host as a look-alike target only produces false matches (ebxcdn.com vs rbxcdn.com).
#
# country_domains lists labels the brand registers under every country code (google.com.et, google.co.ck).
# Only for brands that really do; roblox.com.et is a phishing site.
#
# whole_word: true means a token matches only as a whole word inside a domain (apple-id-verify.com
# matches, applebees.com does not). Use it for brands whose name is an ordinary word.

- id: paypal
  names: [PayPal]
  official_domains: [paypal.com, paypal.me]
- id: netflix
  names: [Netflix]
  official_domains: [netflix.com]
- id: facebook
  names: [Facebook, Meta]
  match_tokens: [facebook, fbook]
  official_domains: [facebook.com, fb.com, meta.com]
- id: instagram
  names: [Instagram]
  official_domains: [instagram.com]
- id: whatsapp
  names: [WhatsApp]
  official_domains: [whatsapp.com, whatsapp.net, wa.me]
- id: microsoft
  names: [Microsoft]
  match_tokens: [microsoft, outlook, office365, onedrive, sharepoint, hotmail, msonline]
  official_domains: [microsoft.com, live.com, office.com, outlook.com, microsoftonline.com, office365.com, sharepoint.com, hotmail.com, onedrive.com]
- id: apple

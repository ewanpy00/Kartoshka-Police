# UAE brand registry, used by every layer (core scoring, safe_action, hunter filters, radar tips).
#
# Fields:
#   names            display names; ASCII names also become match tokens unless match_tokens is set
#   match_tokens     what to look for inside a domain; tokens shorter than 5 letters match a whole
#                    word only (rta-fines.top matches "rta", portal.top does not)
#   official_domains the brand's own domains; every subdomain is official
#   services         safe_action catalog, collected by opening the public site and copying the URL
#   tip_en / tip_ar  one-line advice shown on the scam radar
#
# Official domains were checked to resolve on 2026-11-24. Service URLs exist only where they were
# copied from the public site; other brands fall back to their homepage.

- id: uaepass
  names: [UAE PASS, "الهوية الرقمية", uaepass, uae-pass]
  official_domains: [uaepass.ae]
  official_phones: ["<fill from the official website>"]
  reference_screens: [refs/uaepass_login_ar.png, refs/uaepass_login_en.png]
  keywords: [verify, login, update]
  category: identity
  tip_en: "UAE PASS never asks for your OTP or password through a link in an SMS."
  tip_ar: "الهوية الرقمية لا تطلب رمز التحقق أو كلمة المرور عبر رابط في رسالة نصية."
  services:
    - id: continue
      keywords: [verify, login, update, pass, هوية]
      label_en: "Continue in the official UAE PASS app"
      label_ar: "المتابعة في تطبيق الهوية الرقمية الرسمي"
      url: "https://uaepass.ae"
- id: tamm
  names: [TAMM, "تم", tamm]
  official_domains: [tamm.abudhabi]
  reference_screens: [refs/tamm_home_ar.png]
  keywords: [fine, fines, pay, service]
  category: government
  tip_en: "TAMM never asks for card details by SMS. Check fines only inside the TAMM app or tamm.abudhabi."
  tip_ar: "تم لا تطلب بيانات البطاقة عبر الرسائل النصية. تحقق من المخالفات داخل تطبيق تم أو موقع tamm.abudhabi فقط."
  services:
    - id: traffic_fines
      keywords: [fine, fines, traffic, pay, مخالفة, مخالفات]
      label_en: "Check your real fines in TAMM"
      label_ar: "تحقق من مخالفاتك الحقيقية في تم"
      url: "https://www.tamm.abudhabi/wb/adp/pay-traffic-fines"  # copied from the public catalog
      collected_from: "https://www.tamm.abudhabi"
